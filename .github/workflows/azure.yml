name: Deploy to Azure App Service

# The Azure site deploys from this branch only (and by hand). GitHub Pages (deploy.yml) keeps serving main until launch.
on:
  push:
    branches: [admin-alerts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure
  cancel-in-progress: true

jobs:
  deploy:
    # Skipped until the Azure app exists (repo variable AZURE_WEBAPP_NAME set).
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE: ${{ vars.PUBLIC_URL }}
          BASE: /
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Ship only what the server needs at runtime.
      - run: npm ci --omit=dev
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          # Startup command is set in App Service (General settings: node server.js); a publish profile cannot set it.
